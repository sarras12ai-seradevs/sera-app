    <script>
      // Silence dev HMR WebSocket unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        var str = String((event.reason && (event.reason.message || event.reason)) || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('ws:') !== -1 || str.indexOf('wss:') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('HMR') !== -1) {
          event.preventDefault();
        }
      });
    </script>
